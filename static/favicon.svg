			<stop offset="1" stop-color="#ff8a3a" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="#ff8a3a" />
			<stop offset=".55" stop-color="#e3a54b" />
			<stop offset="1" stop-color="#ffe2a0" />
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="12" fill="#0c0b09" />
	<rect width="64" height="64" rx="12" fill="url(#glow)" />
